name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SFML
        run: sudo apt-get install -y libsfml-dev
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --target tests
